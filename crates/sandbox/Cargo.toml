[package]
name = "standardcode-sandbox"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "StandardCode 沙箱执行后端：策略编译器（命令+策略→argv 纯函数）+ 三平台真隔离原语（Seatbelt/bwrap+seccomp/受限令牌+ACL）+ stdio JSON IPC 帧层（v2.8 §5.3(3) / ARCH-008；M5-WP-01/02）"

[[bin]]
name = "standardcode-sandbox"
path = "src/bin/standardcode-sandbox.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
