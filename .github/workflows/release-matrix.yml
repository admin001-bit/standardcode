name: release-matrix

# WP-07（ADR-0044 决策 7）：三平台发布矩阵实跑（DoD① 载体）——装（本地 tarball）→--version→更（bump 覆盖）
# →卸（CLI uninstall）→残留断言→purge（cleanup 脚本）→残留断言。模拟通道（BLK-02=①）；registry 真实发布步
# =外发动作逐项用户授权（本 workflow 零 publish）。workflow_dispatch 手动触发，非 CI gate（ci.yml 门面不变）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: release-matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: install (workspace)
        run: pnpm install --frozen-lockfile
      - name: pack release (bundle+staged manifest+checksum; DoD⑤⑥)
        run: node scripts/pack-release.mjs --version 0.1.1
      - name: checksum verify (SEC-040)
        run: node scripts/checksum.mjs verify apps/cli/dist
      - name: install (local tarball channel)
        run: npm i -g ./apps/cli/dist/standardcode-oss-cli-0.1.1.tgz
      - name: version verify
        run: standardcode --version
      - name: update (bump overlay — 模拟通道更新路)
        shell: bash
        run: |
          node scripts/pack-release.mjs --version 0.1.2
          npm i -g ./apps/cli/dist/standardcode-oss-cli-0.1.2.tgz
          standardcode --version | grep 0.1.2
      - name: uninstall (CLI default; DoD④)
        run: standardcode uninstall
      - name: residue assert (package gone)
        shell: bash
        run: "! npm ls -g @standardcode-oss/cli"
      - name: purge (cleanup script; user data seeded)
        shell: bash
        run: |
          mkdir -p ~/.standardcode && echo x > ~/.standardcode/marker
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -ExecutionPolicy Bypass -File scripts/cleanup.ps1 -PurgeHome
          else
            bash scripts/cleanup.sh --purge-home
          fi
          [ ! -e ~/.standardcode ] && echo PURGED-OK
      - name: upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ matrix.os }}
          path: apps/cli/dist/
          if-no-files-found: warn

  # WP-09（ENG-030~032 行 483）：发布前 evals 门禁挂接——recorded 常绿+live 抽样双绿=release 前置（DoD③）。
  # live=真实 Provider 抽样（密钥=repo secrets；缺席=本 job 红 LIVE-NOT-CONFIGURED 非静默假过，卡边界明文）。
  evals-gate:
    name: evals-gate (recorded+live 双绿=发布前置)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: install (workspace)
        run: pnpm install --frozen-lockfile
      - name: recorded evals (常绿门)
        run: pnpm run evals:run
      - name: live evals (发布前 live 门；无密钥=红=LIVE-NOT-CONFIGURED 非假绿)
        env:
          STANDARD_CODE_EVALS_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STANDARD_CODE_EVALS_MODEL: ${{ vars.STANDARD_CODE_EVALS_MODEL }}
          STANDARD_CODE_EVALS_BASE_URL: ${{ vars.STANDARD_CODE_EVALS_BASE_URL }}
        run: pnpm run evals:live
