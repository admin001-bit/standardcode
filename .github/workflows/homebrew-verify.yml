name: homebrew-verify

# M8 后·外发第二批（Homebrew 通道）：formula 安装链验证——补 M7 WP-10 登记的未验证面
# （`ruby -c` 语法检查 + `brew` 安装/卸载全链；静态面已由 scripts/verify-channel-checksums.mjs 覆盖）。
# 定位同 release-matrix：workflow_dispatch 手动触发，不进入 gate 门面（ci.yml 不变）。
# runner=macos-latest（arm64；由 ci.yml binaries 泳道 darwin-arm64 产物实跑实证）。
# 2026-09-27：新版 Homebrew 拒绝 tap 外的本地 formula（install ./x.rb 报 "formulae to be in a tap"）
#   ⇒ 验证走本地 tap 形态（tap-new --no-git + brew install <tap>/standardcode，与真实用户路径一致）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: homebrew verify (macos arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: ruby syntax check (M7 未验证面)
        run: ruby -c packaging/homebrew/standardcode.rb

      - name: brew install via local tap (下载 Release 资产 + sha256 校验)
        run: |
          brew tap-new --no-git sc-verify/tap
          TAP_PATH="$(brew --repository sc-verify/tap)"
          cp packaging/homebrew/standardcode.rb "$TAP_PATH/Formula/standardcode.rb"
          brew install sc-verify/tap/standardcode

      - name: brew audit (non-blocking record; tap 名形式——新版 brew 禁 audit 路径形)
        continue-on-error: true
        run: brew audit sc-verify/tap/standardcode

      - name: version assert（期望版本=formula 单一来源；修复：原硬编码 0.1.1 致 0.1.2 发版后误红，2026-09-28）
        run: |
          expected="$(brew info --json=v2 sc-verify/tap/standardcode | jq -r '.formulae[0].versions.stable')"
          got="$(standardcode --version)"
          echo "expected=${expected} got=${got}"
          [ "${got}" = "standardcode ${expected}" ]

      - name: brew test (执行 formula 的 test do 块——M7 起从未执行过)
        run: brew test sc-verify/tap/standardcode

      - name: brew uninstall
        run: brew uninstall standardcode

      - name: residue assert
        run: "! command -v standardcode"

      - name: brew install via published tap (真实用户路径；完全限定名=自动仅信任该 formula)
        run: |
          brew tap admin001-bit/tap
          brew install admin001-bit/tap/standardcode
          expected="$(brew info --json=v2 admin001-bit/tap/standardcode | jq -r '.formulae[0].versions.stable')"
          got="$(standardcode --version)"
          echo "expected=${expected} got=${got}"
          [ "${got}" = "standardcode ${expected}" ]
          brew uninstall standardcode
          ! command -v standardcode
