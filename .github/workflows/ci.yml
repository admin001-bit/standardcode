name: ci

# ENG-070 CI 即验收：三平台矩阵必绿。WP-05 边界=checkout+install+--version；冷启动门禁由 WP-06 追加。
# WP-12：actions 钉版方式经提请按推荐档=major tag（可随时改 SHA）；checkout/setup-node/pnpm-action 均升 node24 运行时版本（v5/v5/v6——消 Node20 弃用告警；v6 另匹配本仓 pnpm@11）。
# WP-12：冷启动阈值在步骤级 env 钉死 400——仓库级 env/vars 无法覆盖（ENG-070：CI 即验收，阈值不可被环境弱化）。
# WP-13（M2 DoD①④）：全量测试门（vitest run，含 WP-03 压缩阈值表测）与七包 typecheck 门入 CI。
# M5-WP-01：rust 泳道（三平台 cargo fmt/clippy/test）——沙箱 crate 纯函数层；真隔离测 WP-02 随本泳道续跑。
# WP-09（ADR-0047 决策 5）：新增 binaries 泳道——三平台**各自**构建本机单文件产物并实跑 version/冷启动门
# （macOS 臂本机不可执行，只能在此 runner 跑；Linux=WSL2 本地/此处双证）。零交叉下载（--native），产物不入库。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install ripgrep (Grep 工具运行依赖，ADR-0029；brew/apt/choco=其指引三源)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep bubblewrap
            # ubuntu-24.04 AppArmor 默认限制非特权 userns（实证 run 35073188446：bwrap setting up
            # uid map Permission denied）——放开 runner 内核开关=GH ubuntu-24 标准处置；本机 WSL2
            # 26.04 非特权 bwrap-ok=同判据环境实证（M5 流水·环境前置条）。
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ripgrep
          else
            choco install ripgrep -y --no-progress
          fi
      - name: verify bwrap usable (WP-03/§3 行131 linux 真隔离环境前置=显式非静默)
        if: runner.os == 'Linux'
        run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid -- /bin/true && echo BWRAP-OK
      - name: version gate
        run: pnpm exec standardcode --version
      - name: cold-start gate
        run: pnpm run bench:cold-start
        env:
          COLD_START_MAX_MS: 400
      - name: typecheck gate
        run: pnpm run typecheck
      - name: rust build (WP-03 sandbox bin for vitest integration)
        run: cargo build -p standardcode-sandbox
      - name: test gate
        run: pnpm run test
        env:
          STANDARD_CODE_SANDBOX_BIN: ${{ runner.os == 'Windows' && 'target/debug/standardcode-sandbox.exe' || 'target/debug/standardcode-sandbox' }}
      - name: rust fmt gate
        run: pnpm run rust:fmt
      - name: rust clippy gate
        run: pnpm run rust:clippy
      - name: rust test gate
        run: pnpm run rust:test

  # WP-09（ADR-0047 决策 1/5）：独立二进制臂——本机目标 Bun compile 单文件产物 + version/冷启动门。
  # 门面不变（gate job 零改动）；本泳道只做本机臂（--native），三平台各自实跑其产物。
  binaries:
    name: binaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build standalone binary (native target; version 门)
        run: node scripts/build-binaries.mjs --native --verify
      - name: standalone binary cold-start gate
        shell: bash
        run: node apps/cli/scripts/cold-start.mjs --bin "$(node scripts/build-binaries.mjs --print-native)"
        env:
          COLD_START_MAX_MS: 400
